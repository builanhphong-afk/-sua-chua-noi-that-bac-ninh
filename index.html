<!DOCTYPE html>
<html lang="vi">
<head>
<meta name="google-site-verification" content="FgWNjWtGRydKhp33NORun33SKe3h-4HVoSVHBDLlXEE" />    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa Chữa Nội Thất Chung Cư Bắc Ninh - Thi Công Trọn Gói Uy Tín</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f9f9f9; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 480px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 95vh; }
        .chat-header { background: #d9534f; color: #fff; padding: 15px; text-align: center; font-weight: bold; font-size: 16px; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 16px; border-radius: 15px; max-width: 85%; line-height: 1.5; font-size: 14px; }
        .bot { background: #f1f0f0; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user { background: #d9534f; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .chat-input { display: flex; border-top: 1px solid #eee; padding: 12px; background: #fff; }
        .chat-input input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; font-size: 14px; }
        .chat-input button { background: #d9534f; color: white; border: none; padding: 0 20px; margin-left: 8px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        .hotline-banner { background: #fff3cd; color: #856404; padding: 10px; text-align: center; font-size: 13px; border-bottom: 1px solid #ffeeba; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Nội Thất Chung Cư Bắc Ninh - Tư Vấn 24/7</div>
    <div class="hotline-banner">📞 Hotline kỹ thuật: <strong>0985.000.002</strong> (Bấm để gọi trực tiếp)</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot">Xin chào anh/chị. Anh/chị có nhu cầu về sửa chữa hoặc làm mới nội thất căn hộ của mình tại Bắc Ninh ạ? Em có thể giúp gì anh/chị?</div>
    </div>
    <div class="chat-input">
        <input type="text" id="userInput" placeholder="Nhập yêu cầu hoặc số điện thoại..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()">Gửi</button>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');

    function appendMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.textContent = text;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;
        
        appendMessage(text, 'user');
        userInput.value = '';

        setTimeout(() => {
            const botReply = "Dạ với yêu cầu của anh/chị, để được tư vấn và báo giá nhanh chính xác nhất, anh/chị vui lòng liên hệ trực tiếp số điện thoại 0985.000.002 hoặc để lại số điện thoại ngay tại đây, nhân viên kỹ thuật bên em sẽ gọi lại cho anh/chị ngay lập tức ạ!";
            appendMessage(botReply, 'bot');
        }, 800);
    }

    function handleKey(event) {
        if (event.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
